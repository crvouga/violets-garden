<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1a1027" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Violet" />
    <meta name="description" content="Violet: a cozy puzzle maze game starring a black pug." />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="apple-touch-icon" href="./icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Nunito:wght@600;800&display=swap"
      rel="stylesheet"
    />
    <title>Violet - Pug Puzzle Maze</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #1a1027;
        overflow: hidden;
        position: fixed;
        inset: 0;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
        overscroll-behavior: none;
        font-family: 'Fredoka', 'Nunito', system-ui, sans-serif;
      }
      #game {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom)
          env(safe-area-inset-left);
        box-sizing: border-box;
        background: #1a1027;
      }
      #game canvas {
        display: block;
        touch-action: none;
        image-rendering: auto;
      }
      /* Preload fonts so Phaser text measures correctly */
      .font-preload {
        position: absolute;
        left: -9999px;
        top: -9999px;
        opacity: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div class="font-preload" aria-hidden="true">
      <span style="font-family: 'Fredoka'; font-weight: 700">Violet</span>
      <span style="font-family: 'Fredoka'; font-weight: 500">Violet</span>
      <span style="font-family: 'Nunito'; font-weight: 800">Violet</span>
      <span style="font-family: 'Nunito'; font-weight: 600">Violet</span>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
