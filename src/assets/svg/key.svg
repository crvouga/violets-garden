<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Near-white so it can be tinted per key colour at runtime. -->
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#e6e6e6"/>
      <stop offset="1" stop-color="#9a9a9a"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5"/>
    </filter>
  </defs>
  <ellipse cx="64" cy="108" rx="34" ry="7" fill="#000" fill-opacity="0.3" filter="url(#soft)"/>
  <g transform="rotate(-35 64 64)">
    <!-- bow -->
    <circle cx="40" cy="64" r="22" fill="none" stroke="url(#metal)" stroke-width="12"/>
    <circle cx="40" cy="64" r="22" fill="none" stroke="#000" stroke-opacity="0.18" stroke-width="3"/>
    <!-- shaft -->
    <rect x="58" y="58" width="52" height="12" rx="6" fill="url(#metal)"/>
    <!-- teeth -->
    <rect x="88" y="66" width="9" height="14" rx="3" fill="url(#metal)"/>
    <rect x="102" y="66" width="9" height="18" rx="3" fill="url(#metal)"/>
    <!-- highlight -->
    <path d="M62 61 h 40" stroke="#fff" stroke-opacity="0.8" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="32" cy="54" r="5" fill="#fff" fill-opacity="0.85"/>
  </g>
</svg>
