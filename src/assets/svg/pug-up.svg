<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <radialGradient id="fur" cx="40%" cy="30%" r="80%">
      <stop offset="0" stop-color="#5d5566"/>
      <stop offset="0.45" stop-color="#2a2630"/>
      <stop offset="1" stop-color="#0c0b0f"/>
    </radialGradient>
    <radialGradient id="furBody" cx="42%" cy="25%" r="85%">
      <stop offset="0" stop-color="#4f4858"/>
      <stop offset="0.5" stop-color="#231f28"/>
      <stop offset="1" stop-color="#0a090c"/>
    </radialGradient>
    <linearGradient id="collar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b98cff"/>
      <stop offset="1" stop-color="#6e3fc4"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
  </defs>

  <ellipse cx="128" cy="226" rx="70" ry="14" fill="#000" fill-opacity="0.28" filter="url(#soft)"/>

  <!-- hind paws -->
  <ellipse cx="96" cy="214" rx="22" ry="13" fill="#1a171e"/>
  <ellipse cx="160" cy="214" rx="22" ry="13" fill="#1a171e"/>

  <!-- body (back) -->
  <ellipse cx="128" cy="170" rx="66" ry="54" fill="url(#furBody)"/>
  <!-- spine highlight -->
  <path d="M128 130 Q 122 170 128 208" fill="none" stroke="#3a3541" stroke-opacity="0.5" stroke-width="10" stroke-linecap="round"/>

  <!-- curled tail on the back -->
  <path d="M128 172 c 22 -18 46 -4 40 16 c -5 16 -28 18 -36 4 c -5 -9 2 -18 12 -16 c 8 2 10 10 4 14" fill="none" stroke="#141218" stroke-width="13" stroke-linecap="round"/>
  <path d="M132 170 c 18 -12 36 -2 32 12" fill="none" stroke="#46414d" stroke-width="4" stroke-linecap="round"/>

  <!-- collar (back) -->
  <path d="M70 128 Q 128 150 186 128 L 186 142 Q 128 166 70 142 Z" fill="url(#collar)"/>
  <path d="M74 132 Q 128 152 182 132" fill="none" stroke="#e5d4ff" stroke-opacity="0.45" stroke-width="2"/>

  <!-- ears (seen from behind) -->
  <path d="M52 80 C 40 50, 74 32, 96 62 L 98 100 Z" fill="#0a090c"/>
  <path d="M204 80 C 216 50, 182 32, 160 62 L 158 100 Z" fill="#0a090c"/>

  <!-- back of head -->
  <ellipse cx="128" cy="96" rx="76" ry="66" fill="url(#fur)"/>
  <!-- fur direction hints -->
  <path d="M100 60 Q 128 50 156 60" fill="none" stroke="#3c3742" stroke-opacity="0.6" stroke-width="4" stroke-linecap="round"/>
  <path d="M92 78 Q 128 68 164 78" fill="none" stroke="#000" stroke-opacity="0.35" stroke-width="4" stroke-linecap="round"/>
  <path d="M100 96 Q 128 88 156 96" fill="none" stroke="#000" stroke-opacity="0.25" stroke-width="3" stroke-linecap="round"/>

  <!-- ear inner fold shading -->
  <path d="M60 78 C 56 62, 78 52, 92 68" fill="none" stroke="#2e2a34" stroke-width="5" stroke-linecap="round"/>
  <path d="M196 78 C 200 62, 178 52, 164 68" fill="none" stroke="#2e2a34" stroke-width="5" stroke-linecap="round"/>
</svg>
