<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9a066"/>
      <stop offset="1" stop-color="#a8683a"/>
    </linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a5228"/>
      <stop offset="1" stop-color="#5a3216"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0c48a"/>
      <stop offset="1" stop-color="#b57a44"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>
  <!-- shadow -->
  <rect x="16" y="26" width="100" height="98" rx="10" fill="#000" fill-opacity="0.35" filter="url(#soft)"/>
  <!-- front face (lower part visible for a 2.5D feel) -->
  <rect x="10" y="18" width="108" height="104" rx="10" fill="url(#front)"/>
  <!-- top face -->
  <rect x="10" y="8" width="108" height="98" rx="10" fill="url(#top)"/>
  <!-- planks -->
  <path d="M10 40 H118 M10 74 H118" stroke="#7a4a24" stroke-opacity="0.55" stroke-width="3"/>
  <path d="M10 44 H118 M10 78 H118" stroke="#f3cf98" stroke-opacity="0.35" stroke-width="2"/>
  <!-- wood grain -->
  <path d="M22 26 q 18 4 36 0 t 34 2 M30 60 q 20 -4 40 0 t 34 -2 M20 92 q 22 4 44 0 t 40 2" fill="none" stroke="#7a4a24" stroke-opacity="0.35" stroke-width="2" stroke-linecap="round"/>
  <!-- frame -->
  <rect x="14" y="12" width="100" height="90" rx="8" fill="none" stroke="url(#edge)" stroke-width="8"/>
  <rect x="14" y="12" width="100" height="90" rx="8" fill="none" stroke="#5a3216" stroke-opacity="0.6" stroke-width="2"/>
  <!-- diagonal brace -->
  <path d="M22 96 L 106 18" stroke="url(#edge)" stroke-width="10" stroke-linecap="round"/>
  <path d="M22 96 L 106 18" stroke="#5a3216" stroke-opacity="0.35" stroke-width="2"/>
  <!-- nails -->
  <g fill="#3b2412">
    <circle cx="22" cy="20" r="2.6"/><circle cx="106" cy="20" r="2.6"/>
    <circle cx="22" cy="94" r="2.6"/><circle cx="106" cy="94" r="2.6"/>
  </g>
  <!-- paw print stamp -->
  <g fill="#5a3216" fill-opacity="0.55" transform="translate(64 60) scale(0.9)">
    <ellipse cx="0" cy="8" rx="11" ry="9"/>
    <circle cx="-12" cy="-4" r="4.5"/><circle cx="-4" cy="-10" r="4.5"/>
    <circle cx="4" cy="-10" r="4.5"/><circle cx="12" cy="-4" r="4.5"/>
  </g>
</svg>
