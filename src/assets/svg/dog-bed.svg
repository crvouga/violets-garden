<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="cushion" cx="50%" cy="45%" r="60%">
      <stop offset="0" stop-color="#f6e6ff"/>
      <stop offset="0.7" stop-color="#d9bdf7"/>
      <stop offset="1" stop-color="#b48fe0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9b5de5"/>
      <stop offset="1" stop-color="#5a2ea0"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffd166" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffd166" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>
  <circle cx="64" cy="64" r="60" fill="url(#glow)"/>
  <ellipse cx="64" cy="70" rx="52" ry="44" fill="#000" fill-opacity="0.3" filter="url(#soft)"/>
  <!-- rim -->
  <ellipse cx="64" cy="64" rx="54" ry="46" fill="url(#rim)"/>
  <ellipse cx="64" cy="60" rx="54" ry="44" fill="#a86ef0"/>
  <!-- rim stitching -->
  <ellipse cx="64" cy="60" rx="48" ry="38" fill="none" stroke="#f3e8ff" stroke-opacity="0.5" stroke-width="2" stroke-dasharray="5 6"/>
  <!-- cushion -->
  <ellipse cx="64" cy="66" rx="40" ry="30" fill="url(#cushion)"/>
  <ellipse cx="64" cy="62" rx="40" ry="28" fill="url(#cushion)"/>
  <!-- cushion folds -->
  <path d="M36 62 Q 64 78 92 62" fill="none" stroke="#b48fe0" stroke-opacity="0.6" stroke-width="2"/>
  <path d="M42 54 Q 64 44 86 54" fill="none" stroke="#fff" stroke-opacity="0.6" stroke-width="2"/>
  <!-- little heart -->
  <path d="M64 74 c -6 -8 -16 -2 -10 6 c 4 5 10 8 10 8 c 0 0 6 -3 10 -8 c 6 -8 -4 -14 -10 -6 z" fill="#ff6b8a" fill-opacity="0.9"/>
</svg>
