<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="glow" cx="50%" cy="45%" r="50%">
      <stop offset="0" stop-color="#ffd98a" stop-opacity="0.9"/>
      <stop offset="0.4" stop-color="#ffb347" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ffb347" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="iron" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6a6a74"/>
      <stop offset="1" stop-color="#26262c"/>
    </linearGradient>
    <radialGradient id="flame" cx="50%" cy="70%" r="60%">
      <stop offset="0" stop-color="#fff6d0"/>
      <stop offset="0.5" stop-color="#ffc24a"/>
      <stop offset="1" stop-color="#ff7a1a" stop-opacity="0.3"/>
    </radialGradient>
  </defs>
  <circle cx="64" cy="58" r="60" fill="url(#glow)"/>
  <!-- bracket -->
  <path d="M64 92 v 20" stroke="url(#iron)" stroke-width="8" stroke-linecap="round"/>
  <path d="M44 112 h 40" stroke="url(#iron)" stroke-width="8" stroke-linecap="round"/>
  <!-- cage -->
  <rect x="42" y="34" width="44" height="58" rx="8" fill="#2a2a30" fill-opacity="0.75" stroke="url(#iron)" stroke-width="5"/>
  <path d="M64 34 v 58 M42 62 h 44" stroke="url(#iron)" stroke-width="3"/>
  <!-- roof -->
  <path d="M36 36 L 64 14 L 92 36 Z" fill="url(#iron)"/>
  <circle cx="64" cy="12" r="5" fill="#4a4a54"/>
  <!-- flame -->
  <ellipse cx="64" cy="66" rx="12" ry="16" fill="url(#flame)"/>
  <ellipse cx="64" cy="70" rx="5" ry="8" fill="#fff8e0"/>
</svg>
