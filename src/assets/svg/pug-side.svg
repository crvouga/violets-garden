<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Facing RIGHT. Flip horizontally for left. -->
  <defs>
    <radialGradient id="fur" cx="45%" cy="28%" r="80%">
      <stop offset="0" stop-color="#5d5566"/>
      <stop offset="0.45" stop-color="#2a2630"/>
      <stop offset="1" stop-color="#0c0b0f"/>
    </radialGradient>
    <radialGradient id="furBody" cx="40%" cy="25%" r="85%">
      <stop offset="0" stop-color="#4a4452"/>
      <stop offset="0.5" stop-color="#211e26"/>
      <stop offset="1" stop-color="#0a090c"/>
    </radialGradient>
    <radialGradient id="eye" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#7a5230"/>
      <stop offset="0.6" stop-color="#2a1608"/>
      <stop offset="1" stop-color="#0d0704"/>
    </radialGradient>
    <linearGradient id="collar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b98cff"/>
      <stop offset="1" stop-color="#6e3fc4"/>
    </linearGradient>
    <radialGradient id="tag" cx="35%" cy="30%" r="75%">
      <stop offset="0" stop-color="#ffe89a"/>
      <stop offset="1" stop-color="#c9902a"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
  </defs>

  <ellipse cx="124" cy="226" rx="76" ry="14" fill="#000" fill-opacity="0.28" filter="url(#soft)"/>

  <!-- curled tail -->
  <path d="M60 150 c -22 -22 -2 -48 20 -34 c 14 9 8 30 -8 28 c -10 -1 -12 -12 -4 -16" fill="none" stroke="#141218" stroke-width="13" stroke-linecap="round"/>
  <path d="M62 144 c -14 -16 0 -34 14 -26" fill="none" stroke="#46414d" stroke-width="4" stroke-linecap="round"/>

  <!-- far legs -->
  <rect x="78" y="186" width="22" height="34" rx="10" fill="#111015"/>
  <rect x="140" y="186" width="22" height="34" rx="10" fill="#111015"/>

  <!-- body -->
  <ellipse cx="112" cy="172" rx="70" ry="46" fill="url(#furBody)"/>
  <ellipse cx="104" cy="160" rx="34" ry="20" fill="#3a3541" fill-opacity="0.3"/>

  <!-- near legs -->
  <rect x="94" y="192" width="24" height="34" rx="11" fill="#1c1920"/>
  <rect x="156" y="192" width="24" height="34" rx="11" fill="#1c1920"/>
  <path d="M100 224 h12 M162 224 h12" stroke="#050408" stroke-width="3" stroke-linecap="round"/>

  <!-- collar -->
  <path d="M146 130 Q 176 140 190 168 L 178 176 Q 166 150 140 142 Z" fill="url(#collar)"/>
  <circle cx="186" cy="176" r="10" fill="url(#tag)" stroke="#8a5f14" stroke-width="2"/>

  <!-- ear (far) -->
  <path d="M122 70 C 104 44, 130 30, 148 56 L 150 92 Z" fill="#0a090c"/>

  <!-- head -->
  <ellipse cx="170" cy="104" rx="64" ry="60" fill="url(#fur)"/>

  <!-- ear (near) -->
  <path d="M124 78 C 108 50, 136 34, 156 62 L 150 104 Z" fill="#0c0b0f"/>
  <path d="M130 76 C 122 60, 138 50, 150 66" fill="none" stroke="#2e2a34" stroke-width="5" stroke-linecap="round"/>

  <!-- wrinkles -->
  <path d="M150 74 Q 184 60 214 84" fill="none" stroke="#000" stroke-opacity="0.55" stroke-width="6" stroke-linecap="round"/>
  <path d="M160 90 Q 188 80 210 96" fill="none" stroke="#000" stroke-opacity="0.35" stroke-width="4" stroke-linecap="round"/>

  <!-- eye -->
  <ellipse cx="196" cy="108" rx="17" ry="19" fill="url(#eye)"/>
  <circle cx="199" cy="110" r="10" fill="#060305"/>
  <circle cx="193" cy="101" r="5.5" fill="#fff" fill-opacity="0.92"/>

  <!-- muzzle -->
  <ellipse cx="216" cy="134" rx="28" ry="24" fill="#17151b"/>
  <path d="M226 118 Q 242 124 238 140 Q 228 146 222 134 Z" fill="#050408"/>
  <path d="M232 144 Q 224 158 208 154" fill="none" stroke="#000" stroke-width="4" stroke-linecap="round"/>
  <!-- tongue -->
  <path d="M212 152 Q 220 170 230 154 Z" fill="#ec6f92"/>
</svg>
